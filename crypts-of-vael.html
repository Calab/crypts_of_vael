<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypts of Vael</title>
<style>
  @font-face { font-family:"Foul Fiend"; src:url("fonts/Foul%20Fiend.otf") format("opentype"); }
  @font-face { font-family:"Swinging Wake"; src:url("fonts/Swinging%20Wake.otf") format("opentype"); }
  :root { --fg:#7dff9a; --dim:#2f7a45; --bg:#000; }
  html,body { background:var(--bg); color:var(--fg); margin:0; }
  :root { --fs:15px; }
  html,body { min-height:100%; }   /* below the minimum size the page scrolls instead of shrinking */
  body { font-family:"Foul Fiend","Courier New",Courier,monospace; font-size-adjust:cap-height 0.86; padding:0 16px; }
  #wrap { padding:12px 0; box-sizing:border-box; margin:0 auto; }
  canvas { display:block; background:#000; border:1px solid #1d4a28; box-sizing:border-box; }
  #log { height:8.2em; overflow:hidden; white-space:pre-wrap; font-size:var(--fs); line-height:1.36em;
         margin-top:8px; display:flex; flex-direction:column; justify-content:flex-end; }
  #log div.old { color:var(--dim); }
  #row { display:flex; align-items:center; gap:6px; border-top:1px solid #1d4a28; padding-top:6px; }
  #row span { font-size:calc(var(--fs) + 1px); }
  #cmd { flex:1; background:#000; color:var(--fg); border:none; outline:none;
         font:calc(var(--fs) + 1px) "Foul Fiend","Courier New",monospace; font-size-adjust:cap-height 0.86; text-transform:uppercase; caret-color:var(--fg); }
  #cmd::placeholder { color:var(--dim); }
  #hint { color:var(--dim); font-size:calc(var(--fs) * 0.8); margin-top:6px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="below">
  <div id="log"></div>
  <div id="row"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" autofocus></div>
  <div id="hint">Type commands (HELP for list). Enter on an empty prompt repeats the last command.</div>
  </div>
</div>
<script>
"use strict";
// ---------- setup ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
// Fonts (in the fonts folder). Canvas text sizes were written with Courier New in mind, so each font

// Swinging Wake's capitals are about 1.4x Courier's; Foul Fiend's are about 2x.
const GAME_FONT = '"Foul Fiend","Courier New",monospace';      // the playing screen
const GAME_FONT_SCALE = 0.62;
const gameFont = px => Math.round(px * GAME_FONT_SCALE) + 'px ' + GAME_FONT;
const TITLE_FONT = '"Swinging Wake","Courier New",monospace';  // the title screen
const TITLE_FONT_SCALE = 1;
const titleFont = px => Math.round(px * TITLE_FONT_SCALE) + 'px ' + TITLE_FONT;
// Canvas text alone doesn't make the browser download a web font, so ask for both up front.

if (document.fonts) for (const f of ['16px "Foul Fiend"', '16px "Swinging Wake"']) document.fonts.load(f).catch(() => {});
const VERSION = '1.0.0';               // shown in the lower right of the title page
const W = 800, H = 500, VH = 440;   // logical drawing size; the canvas is scaled to fit the window
let SCALE = 1;
const MIN_W = 640;                    // smallest game width (640x400 drawing area + text = about 640x480)
function resize() {
  const wrap = document.getElementById('wrap'), below = document.getElementById('below');
  const setFont = w => document.documentElement.style.setProperty('--fs', Math.max(12, Math.min(22, w / 52)) + 'px');
  const availW = Math.max(MIN_W, window.innerWidth - 32);
  // Text size follows the game width, and the text can wrap differently once the width changes,
  // so settle the layout in a few passes.
  let w = availW;
  for (let i = 0; i < 3; i++) {
    setFont(w);
    wrap.style.width = w + 'px';
    const availH = window.innerHeight - below.offsetHeight - 30;
    w = Math.max(MIN_W, Math.floor(Math.min(availW, availH * W / H)));

  setFont(w);
  wrap.style.width = w + 'px';
  const h = Math.round(w * H / W);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const dpr = window.devicePixelRatio || 1;         // full-resolution backing store keeps lines crisp
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  SCALE = cv.width / W;

window.addEventListener('resize', resize);
const CX = W / 2, CY = VH / 2, HW = W / 2, HH = VH / 2;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const DIRN = ['NORTH', 'EAST', 'SOUTH', 'WEST'];
const FG = [125, 255, 154];
// Highlight colours shared by the 3D view and the overhead maps
const RGB = { item: [255, 227, 77], mon: [255, 77, 77], ladder: [77, 232, 255], wall: [255, 255, 255] };
// RNG is swapped for a seeded generator while a level is being built, so a seed always gives the same mazes.
let RNG = Math.random;
const rnd = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const pick = a => a[Math.floor(RNG() * a.length)];

    a |= 0; a = a + 0x6D2B79F5 | 0;

}
function parseSeed(str) {

  if (/^\d+$/.test(str)) return Number(str) % 4294967296;

  for (const ch of str.toUpperCase()) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const fz = z => 1 / (1 + 0.85 * z);
function R(z) { const k = fz(z); return { l: CX - HW * k, r: CX + HW * k, t: CY - HH * k, b: CY + HH * k, k }; }

// ---------- audio ----------
// The game clock. SLEEP moves it forward (clockSkew) to skip time; everything reads gameNow().
let clockSkew = 0;
const gameNow = () => performance.now() + clockSkew;
let simulating = false, simLog = [];   // true while SLEEP fast-forwards: no sounds, messages are held back
let AC = null;
let soundVol = 6, lastSoundVol = 6;   // sound-effect volume 0 (off) .. 9 (loudest); 6 is the original loudness
let musicVol = 7, lastMusicVol = 7;   // music volume 0 (off) .. 9 (loudest)
const musicGainFor = v => Math.max(0, v) / 9 * 1.5;
const sfxGainFor = v => Math.max(0, v) / 6;      // 6 = unchanged, 9 = 1.5x
let sfxGain = null;
function sfxBus(a) {

  return sfxGain;
}
function setSoundVol(v) { soundVol = v; if (AC && sfxGain) sfxGain.gain.setTargetAtTime(sfxGainFor(v), AC.currentTime, 0.05); }
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});   // browsers pause audio until the player interacts
  return AC;
}
function tone(freq, dur, type = 'sine', vol = 0.2, slide = 0, delay = 0) {
  if (simulating || soundVol <= 0) return; const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(sfxBus(a)); o.start(t0); o.stop(t0 + dur + 0.02);
}
// ---------- music ----------
// A note is [midi note number, beats]; 0 = rest. Each voice is a list of notes played back to back.
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
let musicNodes = [];
function stopMusic() { for (const o of musicNodes) { try { o.stop(); } catch (e) { /* already stopped */ } } musicNodes = []; }
function playTune(voices, bpm) {
  stopMusic();
  if (simulating || soundVol <= 0) return;
  const a = ac(); if (!a) return;
  const beat = 60 / bpm, start = a.currentTime + 0.4;
  for (const { notes, wave, vol } of voices) {
    let t = start;
    for (const [m, beats] of notes) {
      const len = beats * beat;
      if (m) {
        const o = a.createOscillator(), g = a.createGain();
        o.type = wave; o.frequency.value = midiHz(m);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + len * 0.75);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len * 0.98);
        o.connect(g).connect(sfxBus(a)); o.start(t); o.stop(t + len);
        musicNodes.push(o);
      }
      t += len;
    }
  }
}
const TUNES = {
  // slow lament in D minor
  death: () => playTune([
    { wave: 'triangle', vol: 0.22, notes: [[62, 1], [65, 1], [69, 1.5], [67, 0.5], [65, 1], [64, 1], [62, 2], [57, 1], [61, 1], [62, 3]] },
    { wave: 'sine', vol: 0.18, notes: [[50, 4], [46, 3], [45, 3], [38, 3]] },
  ], 66),
  // bright fanfare in C major
  victory: () => playTune([
    { wave: 'square', vol: 0.07, notes: [[67, 0.5], [72, 0.5], [76, 0.5], [79, 1], [76, 0.5], [79, 0.5], [81, 0.5], [79, 0.5], [76, 0.5], [72, 0.5], [74, 0.5], [76, 0.5], [72, 1.5],
                                          [0, 0.5], [72, 0.5], [76, 0.5], [79, 0.5], [84, 2]] },
    { wave: 'triangle', vol: 0.2, notes: [[48, 2], [53, 2], [55, 2], [48, 2], [0, 0.5], [48, 0.5], [52, 0.5], [55, 0.5], [60, 2]] },
  ], 150),
};
// ---------- background music ----------
// A small step-sequencer loops two moods: a mellow theme while exploring and a driving one in combat.
// Notes are scheduled a little ahead of the audio clock from the game loop. Toggled by the MUSIC command.
// Each pattern: stepDur seconds per step; bass/lead are per-step MIDI notes (0 = rest), held for *Len steps.
const MUSIC = {
  explore: {   // ~11s mellow loop: Am - F - C - G, each held 8 steps, with a soft sparse arpeggio
    stepDur: 0.34, len: 32, bassWave: 'sine', bassVol: 0.12, bassLen: 8, wave: 'triangle', leadVol: 0.045, leadLen: 3,
    bass: [45, 0, 0, 0, 0, 0, 0, 0, 41, 0, 0, 0, 0, 0, 0, 0, 48, 0, 0, 0, 0, 0, 0, 0, 43, 0, 0, 0, 0, 0, 0, 0],
    lead: [69, 0, 0, 76, 0, 0, 72, 0, 69, 0, 0, 77, 0, 0, 72, 0, 72, 0, 0, 79, 0, 0, 76, 0, 74, 0, 0, 79, 0, 0, 71, 0],
  },
  combat: {
    stepDur: 0.135, len: 16, bassWave: 'sawtooth', bassVol: 0.11, bassLen: 1, wave: 'square', leadVol: 0.05, leadLen: 1,
    bass: [45, 45, 57, 45, 45, 45, 57, 45, 43, 43, 55, 43, 48, 48, 47, 46],
    lead: [69, 0, 72, 0, 69, 0, 70, 0, 69, 0, 68, 0, 69, 72, 76, 74],
  },
};
let musicGain = null, musicState = null;
function musicBus(a) {
  if (!musicGain) { musicGain = a.createGain(); musicGain.gain.value = 1; musicGain.connect(a.destination); }
  return musicGain;
}
function musicNote(a, midi, dur, type, vol, t) {
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = midiHz(midi);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.05, dur));
  o.connect(g).connect(musicBus(a)); o.start(t); o.stop(t + dur + 0.05);
}
function inCombat() {
  if (!G || G.state !== 'play') return false;
  if (gameNow() - G.lastHurt < 4000) return true;
  const S = G.L.S, pd = G.pdist;
  return G.L.mons.some(m => !m.dormant && pd[m.y * S + m.x] <= 2);
}
function musicTick() {
  if (musicVol <= 0 || !G || G.state !== 'play' || G.pending) { musicState = null; return; }
  const a = ac(); if (!a || a.state !== 'running') return;
  if (!musicState) musicState = { nextTime: a.currentTime + 0.08, step: 0, mode: 'explore' };
  musicBus(a).gain.setTargetAtTime(musicGainFor(musicVol), a.currentTime, 0.1);
  while (musicState.nextTime < a.currentTime + 0.25) {
    const want = inCombat() ? 'combat' : 'explore';   // combat cuts in at once; the mellow loop resumes at its boundary
    if (want !== musicState.mode) {
      if (want === 'combat') { musicState.mode = 'combat'; musicState.step = 0; }
      else if (musicState.step === 0) musicState.mode = 'explore';
    }
    const pat = MUSIC[musicState.mode], t = musicState.nextTime, st = musicState.step;
    const b = pat.bass[st], l = pat.lead[st];
    if (b) musicNote(a, b, pat.stepDur * pat.bassLen * 0.95, pat.bassWave, pat.bassVol, t);
    if (l) musicNote(a, l, pat.stepDur * pat.leadLen * 0.9, pat.wave, pat.leadVol, t);

    musicState.step = (st + 1) % pat.len;

function fadeMusicOut() { if (AC && musicGain) musicGain.gain.setTargetAtTime(0.0001, AC.currentTime, 0.15); musicState = null; }
// ---------- monster voices ----------
// Every monster type has its own synthesised cry. Volume falls off with path distance through the maze,
// and the sound is panned left/right according to where the monster is relative to the way you face.
const HEAR_RANGE = 22;
const CRY_GAIN = { mould: 1.5, crawler: 2, hound: 2.1, toad: 2, wraith: 1, golem: 0.75, king: 2.3 };   // evens out loudness
let NOISE = null;
function noiseBuf(a) {

    NOISE = a.createBuffer(1, a.sampleRate, a.sampleRate);

}
function env(g, t, peak, att, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function vOsc(a, out, type, f, t, dur, peak, att = 0.01) {
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); env(g, t, peak, att, dur);
  o.connect(g).connect(out); o.start(t); o.stop(t + dur + 0.05);

}
function vNoise(a, out, t, dur, peak, freq, q = 1, att = 0.005) {

  src.buffer = noiseBuf(a); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  env(g, t, peak, att, dur);

const CRIES = {
  mould(a, out, t) {              // bubbling, wet squelch
    for (let i = 0; i < 3; i++) {
      const st = t + i * 0.13 + Math.random() * 0.05, o = vOsc(a, out, 'sine', 140 + Math.random() * 60, st, 0.1, 0.5, 0.005);
      o.frequency.exponentialRampToValueAtTime(420, st + 0.09);

    vNoise(a, out, t, 0.45, 0.35, 300, 1.2, 0.05);
  },
  crawler(a, out, t) {            // dry skittering clicks
    for (let i = 0; i < 7; i++) vNoise(a, out, t + i * 0.045 + Math.random() * 0.015, 0.025, 0.9, 3500 + Math.random() * 1500, 4, 0.002);
  },
  hound(a, out, t) {              // three panting breaths, then a snarl
    for (let i = 0; i < 3; i++) vNoise(a, out, t + i * 0.28, 0.18, 0.7, 900, 1.5, 0.03);
    const o = vOsc(a, out, 'sawtooth', 95, t + 0.85, 0.45, 0.3, 0.05);

  toad(a, out, t) {               // two wobbling croaks
    for (let i = 0; i < 2; i++) {

      o.frequency.exponentialRampToValueAtTime(55, st + 0.3);

      lfo.frequency.value = 28; lg.gain.value = 25; lfo.connect(lg).connect(o.frequency); lfo.start(st); lfo.stop(st + 0.35);

  swing() { tone(900, 0.09, 'triangle', 0.08, 0.3); },

// ---------- data ----------
const ITEMS = {

    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, CY - 48, W, 96);
    ctx.fillStyle = col(1); ctx.textAlign = 'center'; ctx.font = gameFont(34);
    ctx.fillText('PAUSED', CX, CY + 2);
    ctx.font = gameFont(15); ctx.fillText('ENTER ANY COMMAND TO RESUME', CX, CY + 30);
  }
  if (G.state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, CY - 50, W, 100);
    ctx.fillStyle = col(1); ctx.textAlign = 'center'; ctx.font = gameFont(36);
    ctx.fillText(G.state === 'won' ? 'VICTORY' : 'YOU HAVE PERISHED', CX, CY + 6);
    ctx.font = gameFont(16); ctx.fillText('TYPE RESTART AND PRESS ENTER', CX, CY + 36);
  }
  ctx.restore();
  renderStatus(now);
  const dark = sleepDarkness();                     // SLEEP: fade the whole screen to black and back
  if (dark > 0) { ctx.fillStyle = 'rgba(0,0,0,' + dark + ')'; ctx.fillRect(0, 0, W, H); }
}
function loop(t) { const now = t + clockSkew; if (G) update(now); render(now); requestAnimationFrame(loop); }
resize();
requestAnimationFrame(loop);

// ---------- input ----------
const cmd = document.getElementById('cmd');
cmd.placeholder = 'SEED (BLANK = RANDOM)';
const urlSeed = new URLSearchParams(location.search).get('seed');
if (urlSeed) cmd.value = urlSeed;
document.addEventListener('click', () => cmd.focus());
cmd.addEventListener('keydown', e => {
  ac();
  if (G && G.state === 'play' && !G.fainted) {
    if (e.key === 'F3' && e.shiftKey) { e.preventDefault(); G.view = G.view === 'full' ? 'main' : 'full'; return; }
    if (e.key === 'Escape') { e.preventDefault(); G.view = 'main'; return; }
  }
  if (!G) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const txt = cmd.value.trim().toUpperCase();
      cmd.value = '';
      if (txt === 'LOAD') { if (!loadGame()) { G = null; } }   // stay on title if no save
      else { newGame(parseSeed(txt)); cmd.placeholder = ''; }
    }
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    let v = cmd.value.trim();
    if (G.state !== 'play') {
      // Game over: only a deliberate RESTART leaves this screen, so stray Enter presses are ignored.
      cmd.value = '';
      if (v.toUpperCase() === 'RESTART' || v.toUpperCase() === 'QUIT') { stopMusic(); G = null; cmd.placeholder = 'SEED (BLANK = RANDOM)'; }
      else if (v) msg('THE GAME IS OVER. TYPE RESTART TO RETURN TO THE TITLE.');
      return;
    }
    if (!v) v = G.last; else G.last = v;
    cmd.value = '';
    if (v) exec(v);
    return;
  }
});
</script>
</body>
