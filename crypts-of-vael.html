<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="below">
  <div id="log"></div>
  <div id="row"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" autofocus></div>
  <div id="hint">Type commands (HELP for list). Enter on an empty prompt repeats the last command.</div>
  </div>
</div>
<script>
"use strict";
// ---------- setup ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
// Fonts (in the fonts folder). Canvas text sizes were written with Courier New in mind, so each font
// has a scale that keeps its capital letters about the same height as before.
// Swinging Wake's capitals are about 1.4x Courier's; Foul Fiend's are about 2x.
const GAME_FONT = '"Foul Fiend","Courier New",monospace';      // the playing screen
const GAME_FONT_SCALE = 0.62;
const gameFont = px => Math.round(px * GAME_FONT_SCALE) + 'px ' + GAME_FONT;
const TITLE_FONT = '"Swinging Wake","Courier New",monospace';  // the title screen
const TITLE_FONT_SCALE = 1;
const titleFont = px => Math.round(px * TITLE_FONT_SCALE) + 'px ' + TITLE_FONT;
// Canvas text alone doesn't make the browser download a web font, so ask for both up front.
// Until they arrive (or if the files are missing) the text falls back to Courier New.
if (document.fonts) for (const f of ['16px "Foul Fiend"', '16px "Swinging Wake"']) document.fonts.load(f).catch(() => {});
const VERSION = '1.0.0';               // shown in the lower right of the title page
const W = 800, H = 500, VH = 440;   // logical drawing size; the canvas is scaled to fit the window
let SCALE = 1;
const MIN_W = 640;                    // smallest game width (640x400 drawing area + text = about 640x480)
function resize() {
  const wrap = document.getElementById('wrap'), below = document.getElementById('below');
  const setFont = w => document.documentElement.style.setProperty('--fs', Math.max(12, Math.min(22, w / 52)) + 'px');
  const availW = Math.max(MIN_W, window.innerWidth - 32);
  // Text size follows the game width, and the text can wrap differently once the width changes,
  // so settle the layout in a few passes.
  let w = availW;
  for (let i = 0; i < 3; i++) {
    setFont(w);
    wrap.style.width = w + 'px';
    const availH = window.innerHeight - below.offsetHeight - 30;
    w = Math.max(MIN_W, Math.floor(Math.min(availW, availH * W / H)));
  }
  setFont(w);
  wrap.style.width = w + 'px';
  const h = Math.round(w * H / W);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const dpr = window.devicePixelRatio || 1;         // full-resolution backing store keeps lines crisp
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  SCALE = cv.width / W;
}
window.addEventListener('resize', resize);
const CX = W / 2, CY = VH / 2, HW = W / 2, HH = VH / 2;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const DIRN = ['NORTH', 'EAST', 'SOUTH', 'WEST'];
const FG = [125, 255, 154];
// Highlight colours shared by the 3D view and the overhead maps
const RGB = { item: [255, 227, 77], mon: [255, 77, 77], ladder: [77, 232, 255], wall: [255, 255, 255] };
// RNG is swapped for a seeded generator while a level is being built, so a seed always gives the same mazes.
let RNG = Math.random;
const rnd = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const pick = a => a[Math.floor(RNG() * a.length)];
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function parseSeed(str) {
  str = (str || '').trim();
  if (!str) return 100000 + Math.floor(Math.random() * 900000);
  if (/^\d+$/.test(str)) return Number(str) % 4294967296;
  let h = 2166136261;                       // FNV-1a hash for text seeds
  for (const ch of str.toUpperCase()) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const fz = z => 1 / (1 + 0.85 * z);
function R(z) { const k = fz(z); return { l: CX - HW * k, r: CX + HW * k, t: CY - HH * k, b: CY + HH * k, k }; }
function col(a, c = FG) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// ---------- audio ----------
// The game clock. SLEEP moves it forward (clockSkew) to skip time; everything reads gameNow().
let clockSkew = 0;
const gameNow = () => performance.now() + clockSkew;
let simulating = false, simLog = [];   // true while SLEEP fast-forwards: no sounds, messages are held back
let AC = null;
let soundVol = 6, lastSoundVol = 6;   // sound-effect volume 0 (off) .. 9 (loudest); 6 is the original loudness
let musicVol = 7, lastMusicVol = 7;   // music volume 0 (off) .. 9 (loudest)
// Both volumes (and the level each returns to when switched back on) are remembered in the browser,
// so they survive reloading the page.
const VOL_KEY = 'vael-volume';
try {
  const v = JSON.parse(localStorage.getItem(VOL_KEY) || 'null'), ok = n => Number.isInteger(n) && n >= 0 && n <= 9;
  if (v) {
    if (ok(v.sound)) soundVol = v.sound;
    if (ok(v.music)) musicVol = v.music;
    if (ok(v.lastSound) && v.lastSound > 0) lastSoundVol = v.lastSound;
    if (ok(v.lastMusic) && v.lastMusic > 0) lastMusicVol = v.lastMusic;
  }
} catch (e) { /* storage unavailable or corrupt: keep the defaults */ }
function saveVolumes() {
  try { localStorage.setItem(VOL_KEY, JSON.stringify({ sound: soundVol, music: musicVol, lastSound: lastSoundVol, lastMusic: lastMusicVol })); } catch (e) { /* ignore */ }
}
const musicGainFor = v => Math.max(0, v) / 9 * 1.5;
const sfxGainFor = v => Math.max(0, v) / 6;      // 6 = unchanged, 9 = 1.5x
let sfxGain = null;
function sfxBus(a) {
  if (!sfxGain) { sfxGain = a.createGain(); sfxGain.gain.value = sfxGainFor(soundVol); sfxGain.connect(a.destination); }
  return sfxGain;
}
function setSoundVol(v) { soundVol = v; if (AC && sfxGain) sfxGain.gain.setTargetAtTime(sfxGainFor(v), AC.currentTime, 0.05); }
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});   // browsers pause audio until the player interacts
  return AC;
}
function tone(freq, dur, type = 'sine', vol = 0.2, slide = 0, delay = 0) {
  if (simulating || soundVol <= 0) return; const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(sfxBus(a)); o.start(t0); o.stop(t0 + dur + 0.02);
}
// ---------- music ----------
// A note is [midi note number, beats]; 0 = rest. Each voice is a list of notes played back to back.
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
let musicNodes = [];
function stopMusic() { for (const o of musicNodes) { try { o.stop(); } catch (e) { /* already stopped */ } } musicNodes = []; }
function playTune(voices, bpm) {
  stopMusic();
  if (simulating || soundVol <= 0) return;
  const a = ac(); if (!a) return;
  const beat = 60 / bpm, start = a.currentTime + 0.4;
  for (const { notes, wave, vol } of voices) {
    let t = start;
    for (const [m, beats] of notes) {
      const len = beats * beat;
      if (m) {
        const o = a.createOscillator(), g = a.createGain();
        o.type = wave; o.frequency.value = midiHz(m);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + len * 0.75);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len * 0.98);

        musicNodes.push(o);

      t += len;
    }
  }
}
// ---------- victory hymn ----------
// A slow, ceremonial horn call in D Dorian that turns to D major for its last chord, over a low drone and
// timpani, all sent through a stone-hall reverb. Two horns move mostly in parallel fourths, an old sound.
const VICTORY_BPM = 120;
const VICTORY_HORNS = [
  [[57, .5], [62, .5], [69, 2], [67, .5], [65, .5], [67, 1], [64, 1], [62, 2],          // the call, rising in fourths and a fifth

  const hc = it => it ? col(1, RGB.item) : col(1);   // held item in yellow, empty hand in green
  ctx.textAlign = 'left'; ctx.fillStyle = hc(G.hands[0]); ctx.fillText('L: ' + hn(G.hands[0]), 14, VH + 36);
  ctx.textAlign = 'right'; ctx.fillStyle = hc(G.hands[1]); ctx.fillText('R: ' + hn(G.hands[1]), W - 14, VH + 36);
  ctx.fillStyle = col(1);
  const pulse = G.state === 'play' ? 1 + 0.35 * Math.exp(-(now - G.beatT) / 110) : 1;
  heart(CX - 46, VH + 30, 15 * pulse, G.state === 'dead' ? 0.3 : 1);
  ctx.textAlign = 'left'; ctx.font = gameFont(16); ctx.fillStyle = col(1);
  ctx.fillText(Math.max(0, G.hp) + '/' + G.maxhp, CX - 22, VH + 28);
  ctx.fillStyle = col(0.55); ctx.font = gameFont(13);
  ctx.fillText('DEPTH ' + G.lvl + (G.fatigue >= 8 ? '  EXHAUSTED' : G.fatigue >= 4 ? '  WINDED' : ''), CX - 22, VH + 46);
  ctx.textAlign = 'right'; ctx.fillText('SEED ' + G.seed, W - 14, VH + 14);
  ctx.textAlign = 'left'; ctx.fillStyle = col(0.7, RGB.item);
  ctx.fillText('RANK ' + xpRank() + '   XP ' + G.xp, 14, VH + 14);
}
// ---------- title-screen attract mode ----------
// A separate demo maze (never part of a real game) that an invisible explorer wanders through behind the
// title. It is swapped in as G only while it is being drawn, so the normal corridor renderer can be reused.
const DEMO_MOVE_MS = 650, DEMO_TURN_MS = 750, DEMO_PAUSE_MS = 200, DEMO_STEPS = 400;
let DEMO = null;
function makeDemo() {
  const saved = G, seed = 1 + Math.floor(Math.random() * 999999);
  G = { seed, levels: {} };
  let L;
  try { L = makeLevel(1 + Math.floor(Math.random() * 3)); } finally { G = saved; }
  L.mons = [];                                      // the explorer would walk straight through them
  const p = { x: 1, y: 1, dir: 0 };
  for (let d = 0; d < 4; d++) if (L.g[(p.y + DY[d]) * L.S + p.x + DX[d]] === 0) { p.dir = d; break; }
  DEMO = { seed, L, p, light: { range: 5, rem: 1e9 }, anim: null, swing: null, state: 'play',
           visits: new Uint16Array(L.S * L.S), next: 0, steps: 0 };
  DEMO.visits[p.y * L.S + p.x] = 1;
}
// Picks the next move: head for the least-visited open neighbour (ties favour going straight), so the
// explorer covers the whole maze instead of pacing back and forth. Runs with G = DEMO.
function demoStep(now) {
  const D = DEMO, a = D.anim;
  if ((a && now < a.t0 + a.dur) || now < D.next) return;
  const { L, p } = D, S = L.S;
  let best = -1, bestScore = Infinity;
  for (let d = 0; d < 4; d++) {
    const x = p.x + DX[d], y = p.y + DY[d];
    if (isWall(x, y)) continue;
    const score = D.visits[y * S + x] * 10 + (d === p.dir ? 0 : d === (p.dir + 2) % 4 ? 6 : 3) + Math.random() * 2;
    if (score < bestScore) { bestScore = score; best = d; }
  }
  if (best < 0) return;
  if (best !== p.dir) {                             // turn to face it first; the step comes next time
    const r = (best - p.dir + 4) % 4, steps = r === 2 ? 2 : 1, sign = r === 3 ? -1 : r === 1 ? 1 : (Math.random() < 0.5 ? 1 : -1);
    D.anim = { type: 'turn', fromDir: p.dir, sign, steps, t0: now, dur: DEMO_TURN_MS * steps };
    p.dir = best;
  } else {
    D.anim = { type: 'move', from: { x: p.x, y: p.y, dir: p.dir }, back: false, t0: now, dur: DEMO_MOVE_MS };
    p.x += DX[best]; p.y += DY[best];
    D.visits[p.y * S + p.x]++;
    D.steps++;
  }
  D.next = D.anim.t0 + D.anim.dur + DEMO_PAUSE_MS;
}
function renderDemo(now) {
  if (!DEMO || DEMO.steps >= DEMO_STEPS) makeDemo();   // a fresh maze every so often
  const saved = G, savedAnim = animOn;
  G = DEMO; animOn = true;                          // always glide on the title, even if ANIMATE is off
  try {
    demoStep(now);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, VH); ctx.clip();
    renderView(now);
    ctx.restore();
  } finally { G = saved; animOn = savedAnim; }
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);   // dim it so the title stays readable
}
function renderTitle(now) {
  renderDemo(now);
  ctx.textAlign = 'center'; ctx.fillStyle = col(1, RGB.item);
  ctx.font = titleFont(54); ctx.fillText('CRYPTS OF VAEL', CX, 95);
  ctx.font = titleFont(18); ctx.fillStyle = col(0.7);
  ctx.fillText('A VECTOR DUNGEON CRAWL', CX, 130);
  ctx.fillStyle = col(0.85);
  ctx.fillText('TYPE A SEED NUMBER TO REPLAY A MAZE,', CX, 178);
  ctx.fillText('OR LEAVE IT BLANK FOR A RANDOM ONE.', CX, 202);
  if (lastSeed !== null) { ctx.fillStyle = col(0.55); ctx.fillText('LAST SEED: ' + lastSeed, CX, 232); }
  if (hasSave()) { ctx.fillStyle = col(0.7, RGB.item); ctx.fillText('TYPE  LOAD  TO RESUME YOUR SAVED GAME', CX, 262); }
  drawPolys(SHAPE.wraith(now), CX, 455, 92, 0.9, true, RGB.mon);
  ctx.fillStyle = col(0.5 + 0.5 * Math.sin(now / 300));
  ctx.fillText('PRESS ENTER TO BEGIN', CX, 488);
  ctx.textAlign = 'right'; ctx.font = titleFont(16); ctx.fillStyle = col(0.5);
  ctx.fillText('V' + VERSION, W - 10, H - 10);
}
function render(now) {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!G) { renderTitle(now); return; }
  if (G.fainted && G.state === 'play') return;      // blacked out: blank screen
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, VH); ctx.clip();
  if (G.view === 'explored' || G.view === 'full') renderMap(G.view, now);
  else if (G.view === 'pack') renderPack(); else renderView(now);
  if (now < G.flash) { ctx.fillStyle = col(0.25); ctx.fillRect(0, 0, W, VH); }
  if (G.pending && G.state === 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, CY - 50, W, 100);
    ctx.fillStyle = col(1); ctx.textAlign = 'center'; ctx.font = gameFont(26);
    ctx.fillText(G.pending.quit ? 'QUIT THIS GAME?' : 'START OVER IN MAZE ' + G.pending.seed + '?', CX, CY + 2);
    ctx.font = gameFont(16);
    ctx.fillText(G.pending.quit ? 'Y = RETURN TO THE TITLE      N = KEEP PLAYING' : 'Y = NEW MAZE      N = STAY WHERE YOU ARE', CX, CY + 32);
  }
  if (G.paused && G.state === 'play' && !G.pending) {
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, CY - 48, W, 96);
    ctx.fillStyle = col(1); ctx.textAlign = 'center'; ctx.font = gameFont(34);
    ctx.fillText('PAUSED', CX, CY + 2);
    ctx.font = gameFont(15); ctx.fillText('ENTER ANY COMMAND TO RESUME', CX, CY + 30);
  }
  if (G.state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, CY - 50, W, 100);
    ctx.fillStyle = col(1); ctx.textAlign = 'center'; ctx.font = gameFont(36);
    ctx.fillText(G.state === 'won' ? 'VICTORY' : 'YOU HAVE PERISHED', CX, CY + 6);
    ctx.font = gameFont(16); ctx.fillText('TYPE RESTART AND PRESS ENTER', CX, CY + 36);
  }
  ctx.restore();
  renderStatus(now);
  const dark = sleepDarkness();                     // SLEEP: fade the whole screen to black and back
  if (dark > 0) { ctx.fillStyle = 'rgba(0,0,0,' + dark + ')'; ctx.fillRect(0, 0, W, H); }
}
function loop(t) { const now = t + clockSkew; if (G) update(now); render(now); requestAnimationFrame(loop); }
resize();
requestAnimationFrame(loop);

// ---------- input ----------
const cmd = document.getElementById('cmd');
cmd.placeholder = 'SEED (BLANK = RANDOM)';
const urlSeed = new URLSearchParams(location.search).get('seed');
if (urlSeed) cmd.value = urlSeed;
document.addEventListener('click', () => cmd.focus());
cmd.addEventListener('keydown', e => {
  ac();
  if (G && G.state === 'play' && !G.fainted) {
    if (e.key === 'F3' && e.shiftKey) { e.preventDefault(); G.view = G.view === 'full' ? 'main' : 'full'; return; }
    if (e.key === 'Escape') { e.preventDefault(); G.view = 'main'; return; }
  }
  if (!G) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const txt = cmd.value.trim().toUpperCase();
      cmd.value = '';
      if (txt === 'LOAD') { if (!loadGame()) { G = null; } }   // stay on title if no save
      else { newGame(parseSeed(txt)); cmd.placeholder = ''; }
    }
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    let v = cmd.value.trim();
    if (G.state !== 'play') {
      // Game over: only a deliberate RESTART leaves this screen, so stray Enter presses are ignored.
      cmd.value = '';
      if (v.toUpperCase() === 'RESTART' || v.toUpperCase() === 'QUIT') { stopMusic(); G = null; cmd.placeholder = 'SEED (BLANK = RANDOM)'; }
      else if (v) msg('THE GAME IS OVER. TYPE RESTART TO RETURN TO THE TITLE.');
      return;
    }
    if (!v) v = G.last; else G.last = v;
    cmd.value = '';
    if (v) exec(v);
    return;
  }
});
</script>
</body>
