  :root { --fg:#7dff9a; --dim:#2f7a45; --bg:#000; }
  html,body { background:var(--bg); color:var(--fg); margin:0; }
  :root { --fs:15px; }
  html,body { min-height:100%; }   /* below the minimum size the page scrolls instead of shrinking */
  body { font-family:"Foul Fiend","Courier New",Courier,monospace; font-size-adjust:cap-height 0.86; padding:0 16px; }
  #wrap { padding:12px 0; box-sizing:border-box; margin:0 auto; }
  canvas { display:block; background:#000; border:1px solid #1d4a28; box-sizing:border-box; }
  #log { height:8.2em; overflow:hidden; white-space:pre-wrap; font-size:var(--fs); line-height:1.36em;
         margin-top:8px; display:flex; flex-direction:column; justify-content:flex-end; }
  #log div.old { color:var(--dim); }
  #log .pipe { font-size:calc(1em + 4pt); vertical-align:-0.1em; }   /* the | in HELP looks like an I at normal size */
  #row { display:flex; align-items:center; gap:6px; border-top:1px solid #1d4a28; padding-top:6px; }
  #row span { font-size:calc(var(--fs) + 1px); }
  #cmd { flex:1; background:#000; color:var(--fg); border:none; outline:none;
         font:calc(var(--fs) + 1px) "Foul Fiend","Courier New",monospace; font-size-adjust:cap-height 0.86; text-transform:uppercase; caret-color:var(--fg); }
  #cmd::placeholder { color:var(--dim); }
  #row #timer { color:var(--dim); font-size:var(--fs); white-space:nowrap; }   /* time played, right end of the command line */
  #hint { color:var(--dim); font-size:calc(var(--fs) * 0.8); margin-top:6px; }

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="below">
  <div id="log"></div>
  <div id="row"><span>&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" autofocus><span id="timer"></span></div>
  <div id="hint">Type commands (HELP for list). Enter on an empty prompt repeats the last command.</div>
  </div>
</div>
<script>
"use strict";
// ---------- setup ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
// Fonts (in the fonts folder). Canvas text sizes were written with Courier New in mind, so each font
// has a scale that keeps its capital letters about the same height as before.
// Swinging Wake's capitals are about 1.4x Courier's; Foul Fiend's are about 2x.
const GAME_FONT = '"Foul Fiend","Courier New",monospace';      // the playing screen
const GAME_FONT_SCALE = 0.62;
const gameFont = px => Math.round(px * GAME_FONT_SCALE) + 'px ' + GAME_FONT;
const TITLE_FONT = '"Swinging Wake","Courier New",monospace';  // the title screen
const TITLE_FONT_SCALE = 1;
const titleFont = px => Math.round(px * TITLE_FONT_SCALE) + 'px ' + TITLE_FONT;
// Canvas text alone doesn't make the browser download a web font, so ask for both up front.
// Until they arrive (or if the files are missing) the text falls back to Courier New.
if (document.fonts) for (const f of ['16px "Foul Fiend"', '16px "Swinging Wake"']) document.fonts.load(f).catch(() => {});
const VERSION = '1.1.0';               // shown in the lower right of the title page
const W = 800, H = 500, VH = 440;   // logical drawing size; the canvas is scaled to fit the window
let SCALE = 1;
const MIN_W = 640;                    // smallest game width (640x400 drawing area + text = about 640x480)
function resize() {
  const wrap = document.getElementById('wrap'), below = document.getElementById('below');
  const setFont = w => document.documentElement.style.setProperty('--fs', Math.max(12, Math.min(22, w / 52)) + 'px');
  const availW = Math.max(MIN_W, window.innerWidth - 32);
  // Text size follows the game width, and the text can wrap differently once the width changes,
  // so settle the layout in a few passes.
  let w = availW;
  for (let i = 0; i < 3; i++) {
    setFont(w);
    wrap.style.width = w + 'px';
    const availH = window.innerHeight - below.offsetHeight - 30;
    w = Math.max(MIN_W, Math.floor(Math.min(availW, availH * W / H)));
  }
  setFont(w);
  wrap.style.width = w + 'px';
  const h = Math.round(w * H / W);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const dpr = window.devicePixelRatio || 1;         // full-resolution backing store keeps lines crisp
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  SCALE = cv.width / W;
}
window.addEventListener('resize', resize);
const CX = W / 2, CY = VH / 2, HW = W / 2, HH = VH / 2;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const DIRN = ['NORTH', 'EAST', 'SOUTH', 'WEST'];
const FG = [125, 255, 154];
// Highlight colours shared by the 3D view and the overhead maps
const RGB = { item: [255, 227, 77], mon: [255, 77, 77], ladder: [77, 232, 255], wall: [255, 255, 255] };
// RNG is swapped for a seeded generator while a level is being built, so a seed always gives the same mazes.
let RNG = Math.random;
const rnd = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const pick = a => a[Math.floor(RNG() * a.length)];
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function parseSeed(str) {
  str = (str || '').trim();
  if (!str) return 100000 + Math.floor(Math.random() * 900000);
  if (/^\d+$/.test(str)) return Number(str) % 4294967296;
  let h = 2166136261;                       // FNV-1a hash for text seeds
  for (const ch of str.toUpperCase()) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const fz = z => 1 / (1 + 0.85 * z);
function R(z) { const k = fz(z); return { l: CX - HW * k, r: CX + HW * k, t: CY - HH * k, b: CY + HH * k, k }; }
function col(a, c = FG) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// ---------- audio ----------
// The game clock. SLEEP moves it forward (clockSkew) to skip time; everything reads gameNow().
let clockSkew = 0;
const gameNow = () => performance.now() + clockSkew;
let simulating = false, simLog = [];   // true while SLEEP fast-forwards: no sounds, messages are held back
let AC = null;
let soundVol = 6, lastSoundVol = 6;   // sound-effect volume 0 (off) .. 9 (loudest); 6 is the original loudness
let musicVol = 7, lastMusicVol = 7;   // music volume 0 (off) .. 9 (loudest)
// Both volumes (and the level each returns to when switched back on) are remembered in the browser,
// so they survive reloading the page.
const VOL_KEY = 'vael-volume';
try {
  const v = JSON.parse(localStorage.getItem(VOL_KEY) || 'null'), ok = n => Number.isInteger(n) && n >= 0 && n <= 9;
  if (v) {
    if (ok(v.sound)) soundVol = v.sound;
    if (ok(v.music)) musicVol = v.music;
    if (ok(v.lastSound) && v.lastSound > 0) lastSoundVol = v.lastSound;
    if (ok(v.lastMusic) && v.lastMusic > 0) lastMusicVol = v.lastMusic;
  }
} catch (e) { /* storage unavailable or corrupt: keep the defaults */ }
function saveVolumes() {
  try { localStorage.setItem(VOL_KEY, JSON.stringify({ sound: soundVol, music: musicVol, lastSound: lastSoundVol, lastMusic: lastMusicVol })); } catch (e) { /* ignore */ }
}
const musicGainFor = v => Math.max(0, v) / 9 * 1.5;
const sfxGainFor = v => Math.max(0, v) / 6;      // 6 = unchanged, 9 = 1.5x
let sfxGain = null;
function sfxBus(a) {
  if (!sfxGain) { sfxGain = a.createGain(); sfxGain.gain.value = sfxGainFor(soundVol); sfxGain.connect(a.destination); }
  return sfxGain;
}
function setSoundVol(v) { soundVol = v; if (AC && sfxGain) sfxGain.gain.setTargetAtTime(sfxGainFor(v), AC.currentTime, 0.05); }
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});   // browsers pause audio until the player interacts
  return AC;
}
function tone(freq, dur, type = 'sine', vol = 0.2, slide = 0, delay = 0) {
  if (simulating || soundVol <= 0) return; const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(sfxBus(a)); o.start(t0); o.stop(t0 + dur + 0.02);
}
// ---------- music ----------
// A note is [midi note number, beats]; 0 = rest. Each voice is a list of notes played back to back.
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
let musicNodes = [];
function stopMusic() { for (const o of musicNodes) { try { o.stop(); } catch (e) { /* already stopped */ } } musicNodes = []; }
function playTune(voices, bpm) {
  stopMusic();
  if (simulating || soundVol <= 0) return;
  const a = ac(); if (!a) return;
  const beat = 60 / bpm, start = a.currentTime + 0.4;
  for (const { notes, wave, vol } of voices) {
    let t = start;
    for (const [m, beats] of notes) {
      const len = beats * beat;
      if (m) {
        const o = a.createOscillator(), g = a.createGain();
        o.type = wave; o.frequency.value = midiHz(m);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.03);
        g.gain.setValueAtTime(vol, t + len * 0.75);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len * 0.98);
        o.connect(g).connect(sfxBus(a)); o.start(t); o.stop(t + len);
        musicNodes.push(o);
      }
      t += len;
    }
  }

      // Game over: only a deliberate RESTART leaves this screen, so stray Enter presses are ignored.
      cmd.value = '';
      if (v.toUpperCase() === 'RESTART' || v.toUpperCase() === 'QUIT') { stopMusic(); G = null; cmd.placeholder = 'SEED (BLANK = RANDOM)'; }
      else if (v) msg('THE GAME IS OVER. TYPE RESTART TO RETURN TO THE TITLE.');
      return;
    }
    if (!v) v = G.last; else G.last = v;
    cmd.value = '';
    if (v) exec(v);
    return;
  }
});
</script>
</body>
</html>
