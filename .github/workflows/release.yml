name: Release

# Pushing a tag such as v1.1.3 publishes a GitHub Release with the game,
# its licence and the monster/item reference attached. The tag must match
# VERSION in crypts-of-vael.html. The notes are the tagged commit's message.
# For a tag pushed before this workflow existed, run it by hand from the
# Actions tab and give the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.1.2"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the version matches the tag
        run: |
          version=$(sed -n "s/^const VERSION = '\(.*\)';.*/\1/p" crypts-of-vael.html)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::VERSION in crypts-of-vael.html is $version but the tag is $TAG"
            exit 1
          fi

      - name: Write release notes
        run: git log -1 --format=%B | grep -v '^Co-Authored-By:' > notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: notes.md
          files: |
            crypts-of-vael.html
            license.txt
            Crypts of Vael Monster and Item Reference.odt
